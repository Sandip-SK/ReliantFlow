apiVersion: apps/v1
kind: Deployment
metadata:
  name: reliantflow
  labels:
    app: reliantflow

spec:
  replicas: 3

  selector:
    matchLabels:
      app: reliantflow

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: reliantflow

    spec:
      containers:
        - name: reliantflow

          image: ghcr.io/sandip-sk/reliantflow:3ebc6bbe6e94342ab528d52b0c385207c71b7d63
          env:
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: reliantflow-config
                  key: APP_VERSION
          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20

          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5

          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false